name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: "nightly"
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    if: github.repository == 'galette-plugins/plugin-auto'
    steps:
      # bin/release -n resolves the local develop branch, so it has to exist.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1

      - name: Build and publish
        uses: galette/.github/actions/release-plugin@main
